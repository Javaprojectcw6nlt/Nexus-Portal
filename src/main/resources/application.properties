# Default configuration: used when the project is run locally
# (.\mvnw.cmd spring-boot:run, or from the GitHub download).
# Local database: H2 in memory. Data is created automatically at startup (see DataInitializer).
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# When the WAR runs on the university Tomcat server, the "server" profile is activated
# automatically (see PizzaPortalApplication.configure) and application-server.properties
# replaces these settings with the MySQL database.