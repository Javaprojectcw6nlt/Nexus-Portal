<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Database | Nexus Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments :: nav}"></nav>
    <main class="container mt-4">
        <div class="eyebrow" style="color:#4f46e5">Live database records</div>
        <h1 class="page-title">Database explorer</h1>
        <p class="muted">The page demonstrates three related tables read through Spring Data JPA repositories.</p>

        <!-- Pizzas Table -->
        <div class="section-head d-flex justify-content-between align-items-center mt-4 mb-2">
            <h2>Pizzas</h2>
            <span class="badge bg-primary rounded-pill" th:text="${pizzas.size()}+' records'">0 records</span>
        </div>
        <div class="table-wrap shadow-sm rounded bg-white p-3 mb-4">
            <table class="table table-hover table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Pizza Name</th>
                        <th>Category</th>
                        <th>Vegetarian</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p:${pizzas}">
                        <td th:text="${p.pname}"></td>
                        <td th:text="${p.category != null ? p.category.cname : 'Uncategorized'}"></td>
                        <td>
                            <span class="badge" th:classappend="${p.vegetarian} ? 'bg-success' : 'bg-danger'" th:text="${p.vegetarian} ? 'Yes' : 'No'"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Categories Cards -->
        <div class="section-head mb-3">
            <h2>Categories</h2>
        </div>
        <div class="row g-3 mb-4">
            <div class="col-md-4" th:each="c:${categories}">
                <div class="card shadow-sm h-100 p-3">
                    <span class="badge bg-secondary mb-2 align-self-start">Category</span>
                    <h3 class="h5" th:text="${c.cname}"></h3>
                    <p class="muted small">Price: <span th:text="${c.price}"></span> Ft</p>
                </div>
            </div>
        </div>

        <!-- Orders Table (Showing first 10) -->
        <div class="section-head mb-3">
            <h2>Recent Orders</h2>
        </div>
        <div class="table-wrap shadow-sm rounded bg-white p-3 mb-4">
            <table class="table table-hover table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Pizza Name</th>
                        <th>Amount</th>
                        <th>Taken</th>
                        <th>Dispatched</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="o:${orders}">
                        <td th:text="${o.pizzaname}"></td>
                        <td th:text="${o.amount}"></td>
                        <td th:text="${o.taken != null ? #temporals.format(o.taken, 'yyyy-MM-dd HH:mm') : '—'}"></td>
                        <td th:text="${o.dispatched != null ? #temporals.format(o.dispatched, 'yyyy-MM-dd HH:mm') : '—'}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
