<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Database | Nexus Portal</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="eyebrow" style="color:#4f46e5">Live database records</div><h1 class="page-title">Database explorer</h1><p class="muted">The page demonstrates three related tables read through Spring Data JPA repositories.</p><div class="section-head"><h2>Employees</h2><span class="pill" th:text="${employees.size()}+' records'">0 records</span></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Job title</th><th>Department</th><th>Salary (NGN)</th></tr></thead><tbody><tr th:each="e:${employees}"><td th:text="${e.fullName}"></td><td th:text="${e.email}"></td><td th:text="${e.jobTitle}"></td><td th:text="${e.department != null ? e.department.name : 'Unassigned'}"></td><td th:text="${e.salary != null ? #numbers.formatDecimal(e.salary,1,'COMMA',2,'POINT') : '—'}"></td></tr></tbody></table></div><div class="section-head"><h2>Departments</h2></div><div class="grid"><article class="card" th:each="d:${departments}"><span class="pill">Department</span><h3 th:text="${d.name}"></h3><p class="muted" th:text="${d.description}"></p></article></div><div class="section-head"><h2>Projects</h2></div><div class="table-wrap"><table><thead><tr><th>Project</th><th>Description</th><th>Status</th><th>Department</th></tr></thead><tbody><tr th:each="p:${projects}"><td th:text="${p.name}"></td><td th:text="${p.description}"></td><td><span class="pill" th:text="${p.status}"></span></td><td th:text="${p.department != null ? p.department.name : 'Unassigned'}"></td></tr></tbody></table></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
