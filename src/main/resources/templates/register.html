<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | Nexus Portal</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="card form-card"><div class="eyebrow" style="color:#4f46e5">Create an account</div><h1 class="page-title">Visitor registration</h1><p class="muted">New accounts receive the standard registered-user role, never admin access.</p><div th:if="${error}" class="alert errorbox" th:text="${error}"></div><form th:action="@{/register}" method="post"><div class="field"><label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]+" required></div><div class="field"><label for="password">Password (minimum 10 characters)</label><input id="password" name="password" type="password" minlength="10" required></div><button class="btn" type="submit">Create account →</button></form></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
