<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Nexus Portal</title>
    <!-- Bootstrap 5 Named Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav th:replace="~{fragments :: nav}"></nav>

    <main class="container mt-4">
        <div class="card form-card shadow-sm p-4 bg-white rounded mx-auto" style="max-width: 450px;">
            <div class="eyebrow" style="color:#4f46e5">Create an account</div>
            <h1 class="page-title">Visitor registration</h1>
            <p class="text-muted small mb-4">New accounts receive the standard registered-user role, never admin access.</p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/register}" method="post">
                <div class="field mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" class="form-control" name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]+" required>
                    <div class="form-text">Use letters, numbers, dots, underscores or hyphens.</div>
                </div>

                <div class="field mb-4">
                    <label for="password" class="form-label">Password (minimum 10 characters)</label>
                    <input id="password" class="form-control" name="password" type="password" minlength="10" required>
                </div>

                <button class="btn btn-primary w-100" type="submit">Create account →</button>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
