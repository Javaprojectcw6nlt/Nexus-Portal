<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee form | Nexus Portal</title>
    <!-- Bootstrap 5 Named Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav th:replace="~{fragments :: nav}"></nav>

    <main class="container mt-4">
        <div class="card form-card shadow-sm p-4 bg-white rounded mx-auto" style="max-width: 600px;">
            <h1 class="page-title" th:text="${employee.id == null ? 'Add employee' : 'Edit employee'}">Employee</h1>
            
            <form th:action="@{/crud/save}" th:object="${employee}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="field mb-3">
                    <label for="fullName" class="form-label">Full name</label>
                    <input id="fullName" class="form-control" th:field="*{fullName}" required>
                    <div class="error text-danger" th:errors="*{fullName}"></div>
                </div>

                <div class="field mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" type="email" class="form-control" th:field="*{email}" required>
                    <div class="error text-danger" th:errors="*{email}"></div>
                </div>

                <div class="field mb-3">
                    <label for="jobTitle" class="form-label">Job title</label>
                    <input id="jobTitle" class="form-control" th:field="*{jobTitle}" required>
                    <div class="error text-danger" th:errors="*{jobTitle}"></div>
                </div>

                <div class="field mb-3">
                    <label for="department" class="form-label">Department</label>
                    <select id="department" name="department.id" class="form-select">
                        <option value="">Unassigned</option>
                        <option th:each="d:${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${employee.department != null && employee.department.id == d.id}"></option>
                    </select>
                </div>

                <div class="field mb-4">
                    <label for="salary" class="form-label">Salary (NGN)</label>
                    <input id="salary" type="number" min="0" step="0.01" class="form-control" th:field="*{salary}">
                    <div class="error text-danger" th:errors="*{salary}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save employee</button> 
                    <a class="btn btn-secondary" th:href="@{/crud}">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
