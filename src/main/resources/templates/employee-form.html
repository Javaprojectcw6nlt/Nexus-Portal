<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employee form | Nexus Portal</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="card form-card"><h1 class="page-title" th:text="${employee.id == null ? 'Add employee' : 'Edit employee'}">Employee</h1><form th:action="@{/crud/save}" th:object="${employee}" method="post"><input type="hidden" th:field="*{id}"><div class="field"><label for="fullName">Full name</label><input id="fullName" th:field="*{fullName}" required><div class="error" th:errors="*{fullName}"></div></div><div class="field"><label for="email">Email</label><input id="email" type="email" th:field="*{email}" required><div class="error" th:errors="*{email}"></div></div><div class="field"><label for="jobTitle">Job title</label><input id="jobTitle" th:field="*{jobTitle}" required><div class="error" th:errors="*{jobTitle}"></div></div><div class="field"><label for="department">Department</label><select id="department" name="department.id"><option value="">Unassigned</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${employee.department != null && employee.department.id == d.id}"></option></select></div><div class="field"><label for="salary">Salary (NGN)</label><input id="salary" type="number" min="0" step="0.01" th:field="*{salary}"><div class="error" th:errors="*{salary}"></div></div><button class="btn" type="submit">Save employee</button> <a class="btn secondary" th:href="@{/crud}">Cancel</a></form></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
