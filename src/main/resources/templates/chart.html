<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chart | Nexus Portal</title>
    <!-- Bootstrap 5 Named Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <nav th:replace="~{fragments :: nav}"></nav>

    <main class="container mt-4">
        <div class="eyebrow" style="color:#4f46e5">Database Analytics</div>
        <h1 class="page-title">Pizzas by Category</h1>
        <p class="muted">Chart.js visualization based on live grouped counts from the pizza database.</p>

        <div class="chart-card shadow-sm p-4 bg-white rounded">
            <div style="position: relative; height: 400px; width: 100%;">
                <canvas id="pizzaChart" aria-label="Pizzas by category chart"></canvas>
            </div>
            <p id="chartError" class="error text-danger mt-2 fw-bold"></p>
        </div>
        
        <p class="notice mt-3">
            The chart fetches its labels and values from <code>api/chart/pizzas-by-category</code>.
        </p>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // REMOVED the leading slash here!
            fetch('api/chart/pizzas-by-category')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok: ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    const ctx = document.getElementById('pizzaChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Number of Pizzas',
                                data: data.values,
                                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                                borderColor: 'rgba(54, 162, 235, 1)',
                                borderWidth: 1,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { precision: 0 }
                                }
                            },
                            plugins: {
                                legend: { display: false }
                            }
                        }
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('chartError').textContent = 'Error loading chart: ' + error.message;
                });
        });
    </script>
</body>
</html>
