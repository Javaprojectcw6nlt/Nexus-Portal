<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chart | Nexus Portal</title>
    <!-- Bootstrap 5 Named Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <nav th:replace="~{fragments :: nav}"></nav>

    <main class="container mt-4">
        <div class="eyebrow" style="color:#4f46e5">Database Analytics</div>
        <!-- Updated title for the new database -->
        <h1 class="page-title">Pizzas by Category</h1>
        <p class="muted">Chart.js visualisation based on live grouped counts from the database.</p>

        <div class="chart-card shadow-sm p-4 bg-white rounded">
            <canvas id="deptChart" aria-label="Pizzas by category chart"></canvas>
            <p id="chartError" class="error text-danger mt-2"></p>
        </div>
        
        <p class="notice mt-3">
            The chart fetches its labels and values from <code>/api/chart/employees-by-department</code>. 
            (Note: We will update this endpoint name when we change the backend to the Pizza database).
        </p>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>

    <script>
        fetch('/api/chart/employees-by-department')
            .then(r => {
                if (!r.ok) throw new Error('Could not load chart data');
                return r.json();
            })
            .then(d => {
                new Chart(document.getElementById('deptChart'), {
                    type: 'bar',
                    data: {
                        labels: d.labels,
                        datasets: [{
                            label: 'Number of Pizzas', // Changed label for pizza
                            data: d.values,
                            backgroundColor: 'rgba(54, 162, 235, 0.6)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1,
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { precision: 0 }
                            }
                        },
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
                document.querySelector('.chart-card').style.height = '430px';
            })
            .catch(e => document.getElementById('chartError').textContent = e.message);
    </script>
</body>
</html>
