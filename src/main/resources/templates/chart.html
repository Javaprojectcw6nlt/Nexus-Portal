<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chart | Nexus Portal</title><link rel="stylesheet" th:href="@{/css/style.css}"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="eyebrow" style="color:#4f46e5">Database analytics</div><h1 class="page-title">Employees by department</h1><p class="muted">Chart.js visualisation based on live grouped counts from the employee database.</p><div class="chart-card"><canvas id="deptChart" aria-label="Employees by department chart"></canvas><p id="chartError" class="error"></p></div><p class="notice">The chart fetches its labels and values from <code>/api/chart/employees-by-department</code>. Internet access is needed for the Chart.js CDN.</p></main><footer th:replace="~{fragments :: footer}"></footer><script>
fetch('api/chart/employees-by-department').then(r=>{if(!r.ok)throw new Error('Could not load chart data');return r.json()}).then(d=>{new Chart(document.getElementById('deptChart'),{type:'bar',data:{labels:d.labels,datasets:[{label:'Employees',data:d.values,borderWidth:1,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{precision:0}}},plugins:{legend:{display:false}}}});document.querySelector('.chart-card').style.height='430px'}).catch(e=>document.getElementById('chartError').textContent=e.message);
</script></body></html>
