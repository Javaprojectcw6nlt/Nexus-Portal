<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employee CRUD | Nexus Portal</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="section-head"><div><div class="eyebrow" style="color:#4f46e5">Administrator workspace</div><h1 class="page-title">Manage employees</h1></div><a class="btn" th:href="@{/crud/new}">+ Add employee</a></div><div th:if="${success}" class="alert" th:text="${success}"></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Actions</th></tr></thead><tbody><tr th:each="e:${employees}"><td th:text="${e.fullName}"></td><td th:text="${e.email}"></td><td th:text="${e.jobTitle}"></td><td th:text="${e.department != null ? e.department.name : 'Unassigned'}"></td><td><div class="inline-actions"><a class="btn small secondary" th:href="@{/crud/edit/{id}(id=${e.id})}">Edit</a><form th:action="@{/crud/delete/{id}(id=${e.id})}" method="post"><button class="btn small danger" data-confirm="Delete this employee record?" type="submit">Delete</button></form></div></td></tr></tbody></table></div><p class="notice">This page and its operations are restricted to users with the ADMIN role.</p></main><footer th:replace="~{fragments :: footer}"></footer><script th:src="@{/js/app.js}"></script></body></html>
