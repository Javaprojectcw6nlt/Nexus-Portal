<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Nexus Portal</title>
    <!-- Bootstrap 5 Named Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav th:replace="~{fragments :: nav}"></nav>

    <main class="container mt-4">
        <div class="card form-card shadow-sm p-4 bg-white rounded mx-auto" style="max-width: 400px;">
            <div class="eyebrow" style="color:#4f46e5">Welcome back</div>
            <h1 class="page-title">Sign in</h1>

            <div th:if="${param.error}" class="alert alert-danger">
                Username or password is incorrect.
            </div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="@{/login}" method="post">
                <div class="field mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" class="form-control" name="username" autocomplete="username" required>
                </div>

                <div class="field mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" class="form-control" name="password" type="password" autocomplete="current-password" required>
                </div>

                <button class="btn btn-primary w-100" type="submit">Sign in →</button>
            </form>
            
            <p class="notice mt-3 text-center text-muted">
                New here? <a th:href="@{/register}">Create a visitor account</a>.
            </p>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
