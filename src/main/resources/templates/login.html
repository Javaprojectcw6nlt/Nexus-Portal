<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | Nexus Portal</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="card form-card"><div class="eyebrow" style="color:#4f46e5">Welcome back</div><h1 class="page-title">Sign in</h1><div th:if="${param.error}" class="alert errorbox">Username or password is incorrect.</div><div th:if="${success}" class="alert" th:text="${success}"></div><form th:action="@{/login}" method="post"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Sign in →</button></form><p class="notice">New here? <a th:href="@{/register}">Create a visitor account</a>.</p></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
