<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nexus Portal | Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments :: nav}"></nav>
    <main class="container mt-4">
        <div th:if="${param.logout}" class="alert alert-success">You have signed out successfully.</div>
        <div class="hero p-5 mb-4 bg-light rounded-3 shadow-sm">
            <div class="eyebrow text-primary fw-bold">Pizza · Orders · Menu</div>
            <h1 class="display-5 fw-bold">Welcome to the Pizza Database.</h1>
            <p class="lead">Explore our menu, check order statistics, and manage the pizza records.</p>
            <a class="btn btn-primary btn-lg" th:href="@{/database}">Explore the database →</a> 
        </div>
        <div class="row text-center mb-5">
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <span class="text-muted text-uppercase small">Pizzas</span>
                    <strong class="display-6" th:text="${pizzaCount}">0</strong>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <span class="text-muted text-uppercase small">Categories</span>
                    <strong class="display-6" th:text="${categoryCount}">0</strong>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <span class="text-muted text-uppercase small">Orders</span>
                    <strong class="display-6" th:text="${orderCount}">0</strong>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-between align-items-end mb-3">
            <div>
                <div class="eyebrow text-primary fw-bold">Recently added</div>
                <h2>New Pizzas</h2>
            </div>
            <a th:href="@{/database}" class="btn btn-sm btn-outline-primary">View all data →</a>
        </div>
        <div class="table-wrap shadow-sm rounded bg-white p-3 mb-5">
            <table class="table table-hover table-bordered align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Pizza Name</th>
                        <th>Category</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p:${latestPizzas}">
                        <td th:text="${p.pname}">Pizza Name</td>
                        <td th:text="${p.category != null ? p.category.cname : 'Uncategorized'}">Category</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
