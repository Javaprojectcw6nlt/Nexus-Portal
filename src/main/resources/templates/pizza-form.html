<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pizza form | Nexus Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments :: nav}"></nav>
    <main class="container mt-4">
        <div class="card form-card shadow-sm p-4 bg-white rounded mx-auto" style="max-width: 600px;">
            <h1 class="page-title" th:text="${pizza.pname == null ? 'Add Pizza' : 'Edit Pizza'}">Pizza</h1>
            <form th:action="@{/crud/save}" th:object="${pizza}" method="post">
                <div class="field mb-3">
                    <label for="pname" class="form-label">Pizza Name</label>
                    <input id="pname" class="form-control" th:field="*{pname}" required th:readonly="${pizza.pname != null}">
                    <div class="error text-danger" th:errors="*{pname}"></div>
                </div>
                <div class="field mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select id="category" name="category.cname" class="form-select">
                        <option value="">Uncategorized</option>
                        <option th:each="c:${categories}" th:value="${c.cname}" th:text="${c.cname + ' (' + c.price + ')'}" th:selected="${pizza.category != null && pizza.category.cname == c.cname}"></option>
                    </select>
                </div>
                <div class="field mb-4 form-check">
                    <input type="checkbox" id="vegetarian" class="form-check-input" th:field="*{vegetarian}">
                    <label for="vegetarian" class="form-check-label">Vegetarian</label>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save Pizza</button> 
                    <a class="btn btn-secondary" th:href="@{/crud}">Cancel</a>
                </div>
            </form>
        </div>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
