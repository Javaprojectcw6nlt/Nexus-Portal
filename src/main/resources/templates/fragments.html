<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

    <nav class="nav" th:fragment="nav">
        <a class="brand" th:href="@{/}">NEXUS<span> / PORTAL</span></a>
        <div class="navlinks">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/database}">Database</a>
            <a th:href="@{/contact}">Contact</a>
            <a th:href="@{/chart}">Chart</a>
            <a th:href="@{/api/employees}">REST API</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/messages}">Messages</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/crud}">CRUD</a>
            <a sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
            <a sec:authorize="isAnonymous()" th:href="@{/register}">Register</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <footer class="footer" th:fragment="footer">
        <strong>Nexus Portal</strong> · Java Spring Boot Seminar Project<br>
        Created by: <strong>Abdurrahman Umar Baba</strong> (Neptun: <strong>cw6nlt</strong>)
    </footer>

</body>
</html>
