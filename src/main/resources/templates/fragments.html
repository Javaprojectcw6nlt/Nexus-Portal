<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nexus Portal</title>
    <!-- Bootstrap 5 Named Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Added Bootstrap Navbar classes for named theme requirement -->
    <nav class="nav navbar navbar-expand-lg navbar-light bg-light" th:fragment="nav">
        <div class="container-fluid">
            <a class="brand navbar-brand" th:href="@{/}">NEXUS<span> / PORTAL</span></a>
            <div class="navlinks navbar-nav ms-auto d-flex flex-row gap-3 align-items-center">
                <a class="nav-link" th:href="@{/}">Home</a>
                <a class="nav-link" th:href="@{/database}">Database</a>
                <a class="nav-link" th:href="@{/contact}">Contact</a>
                <a class="nav-link" th:href="@{/chart}">Chart</a>
                <a class="nav-link" th:href="@{/api/employees}">REST API</a>
                <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/messages}">Messages</a>
                <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/crud}">CRUD</a>
                <a class="nav-link" sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
                <a class="nav-link" sec:authorize="isAnonymous()" th:href="@{/register}">Register</a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Added Bootstrap text classes to footer -->
    <footer class="footer text-center mt-5 p-3 bg-light border-top" th:fragment="footer">
        <strong>Nexus Portal</strong> · Java Spring Boot Seminar Project<br>
        Created by: <strong>Abdurrahman Umar Baba</strong> (Neptun: <strong>cw6nlt</strong>)
    </footer>

</body>
</html>
