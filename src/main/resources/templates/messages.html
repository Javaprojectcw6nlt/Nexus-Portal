<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Messages | Nexus Portal</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><h1 class="page-title">Contact messages</h1><p class="muted">Only authenticated users can view this page. Newest messages appear first.</p><div th:if="${#lists.isEmpty(messages)}" class="card empty">No messages yet. Submit the contact form to create the first message.</div><div class="grid two"><article class="card" th:each="m:${messages}"><div class="inline-actions"><span class="pill" th:text="${m.sentAt != null ? #temporals.format(m.sentAt,'dd MMM yyyy, HH:mm') : 'Pending timestamp'}"></span></div><h3 th:text="${m.subject}"></h3><p class="muted">From <strong th:text="${m.name}"></strong> · <span th:text="${m.email}"></span></p><p style="white-space:pre-wrap" th:text="${m.message}"></p></article></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
