<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Messages | Nexus Portal</title>
    <!-- Bootstrap 5 Named Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav th:replace="~{fragments :: nav}"></nav>

    <main class="container mt-4">
        <h1 class="page-title mb-2">Contact messages</h1>
        <p class="text-muted mb-4">Only authenticated users can view this page. Newest messages appear first.</p>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(messages)}" class="card shadow-sm p-5 text-center bg-light">
            <h4 class="text-muted">No messages yet.</h4>
            <p>Submit the contact form to create the first message.</p>
        </div>

        <!-- Messages Grid -->
        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="m:${messages}">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
                        <span class="badge bg-secondary" th:text="${m.sentAt != null ? #temporals.format(m.sentAt,'dd MMM yyyy, HH:mm') : 'Pending timestamp'}"></span>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title fw-bold" th:text="${m.subject}">Subject</h5>
                        <h6 class="card-subtitle mb-3 text-muted small">
                            From <strong th:text="${m.name}"></strong> · <span th:text="${m.email}"></span>
                        </h6>
                        <p class="card-text" style="white-space:pre-wrap" th:text="${m.message}"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
