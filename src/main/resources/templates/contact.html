<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact | Nexus Portal</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="card form-card"><div class="eyebrow" style="color:#4f46e5">We'd love to hear from you</div><h1 class="page-title">Send a message</h1><p class="muted">Valid messages are saved in the database and appear in the Messages area for signed-in users.</p><div th:if="${success}" class="alert" th:text="${success}"></div><form th:action="@{/contact}" th:object="${contactMessage}" method="post"><div class="field"><label for="name">Your name</label><input id="name" th:field="*{name}" maxlength="100" required><div class="error" th:errors="*{name}"></div></div><div class="field"><label for="email">Email address</label><input id="email" type="email" th:field="*{email}" maxlength="180" required><div class="error" th:errors="*{email}"></div></div><div class="field"><label for="subject">Subject</label><input id="subject" th:field="*{subject}" maxlength="160" required><div class="error" th:errors="*{subject}"></div></div><div class="field"><label for="message">Message</label><textarea id="message" th:field="*{message}" maxlength="3000" required></textarea><div class="error" th:errors="*{message}"></div></div><button class="btn" type="submit">Send message →</button></form></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
