<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Nexus Portal</title>
    <!-- Bootstrap 5 Named Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav th:replace="~{fragments :: nav}"></nav>

    <main class="container mt-4">
        <div class="card form-card shadow-sm p-4 bg-white rounded">
            <div class="eyebrow" style="color:#4f46e5">We'd love to hear from you</div>
            <h1 class="page-title">Send a message</h1>
            <p class="muted">Valid messages are saved in the database and appear in the Messages area for signed-in users.</p>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="@{/contact}" th:object="${contactMessage}" method="post">
                <div class="field mb-3">
                    <label for="name" class="form-label">Your name</label>
                    <input id="name" class="form-control" th:field="*{name}" maxlength="100" required>
                    <div class="error text-danger" th:errors="*{name}"></div>
                </div>
                <div class="field mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input id="email" type="email" class="form-control" th:field="*{email}" maxlength="180" required>
                    <div class="error text-danger" th:errors="*{email}"></div>
                </div>
                <div class="field mb-3">
                    <label for="subject" class="form-label">Subject</label>
                    <input id="subject" class="form-control" th:field="*{subject}" maxlength="160" required>
                    <div class="error text-danger" th:errors="*{subject}"></div>
                </div>
                <div class="field mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" class="form-control" th:field="*{message}" maxlength="3000" rows="5" required></textarea>
                    <div class="error text-danger" th:errors="*{message}"></div>
                </div>
                <button class="btn btn-primary" type="submit">Send message →</button>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
